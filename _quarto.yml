---
project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "*.qmd"
    - "**/*.ipynb"
    - "**/*.md"
    - "!publications/**"
    - "!notebooks/workshop.ipynb"
    - "!notebooks/agu2024.qmd"
    - "!notebooks/agu2024.ipynb"
    - "!notebooks/agu2024_combined.ipynb"
    - "!notebooks/interactive.ipynb"
    - "!tools/g.ssurgo.query/**"
    - "!tools/v.in.usgs.waterservices/**"
    - "!tools/r.soildb/**"
website:
  navbar:
    title: "SIMWE Soils Project"
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Reports"
        href: output/project_reports.qmd
      - text: "Notebooks"
        href: notebooks/index.qmd
      - text: "Presentations"
        href: presentations/index.qmd
      - text: "Data"
        href: data/index.qmd
      - text: "Scripts"
        href: scripts/index.qmd
      - text: "Tools"
        href: tools/index.qmd
    tools:
      - icon: github
        menu:
          - text: "Source Code"
            href: "https://github.com/ncsu-geoforall-lab/NRCS_SIMWE"
          - text: "Report an Issue"
            href: "https://github.com/ncsu-geoforall-lab/NRCS_SIMWE/issues"

execute:
  freeze: auto
format:
  html:
    theme: [pandoc, grass.scss]
    toc: true
    toc-title: Table of Contents
